# FINAL held-out retrieval test set for Alex AI search (100 questions).
# Written against a frozen brain snapshot (notes without `questions:` fields),
# without running the search command. Use it ONCE, for the final verdict,
# after all tuning on evals/retrieval_holdout.yaml and
# evals/retrieval_holdout_2.yaml is finished. Do not look at individual
# misses and re-tune; report aggregate hit rates only.
#
# Keys:
#   style: plain  -> everyday business-owner wording, no Hormozi framework names
#          jargon -> uses the framework's own vocabulary (easy control group)
#   expect_notes: the 1-3 notes a correct answer must draw on (strict hit).
#   accept_notes: other notes that would also be a fully acceptable landing
#                 place (siblings, parent framework, near-duplicates); use
#                 expect + accept for a lenient hit rate.
#
# Mix: ~29 per book, 13 that span two books; 85 plain, 15 jargon.

