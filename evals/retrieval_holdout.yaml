# Held-out retrieval test set for Alex AI search.
# Written against a frozen brain snapshot, without running the search command,
# so it can be used to measure search changes honestly. Do not tune search on
# these questions one by one; report aggregate hit rates.
#
# Same keys as evals/questions.yaml, plus:
#   style: plain  -> everyday business-owner wording, no Hormozi framework names
#          jargon -> uses the framework's own name (easy control group)
# expect_notes: the 1-3 notes that most directly answer the question.

# ---------------------------------------------------------------------------
