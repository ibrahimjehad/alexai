# Second held-out retrieval test set for Alex AI search (105 questions).
# Written against a frozen brain snapshot (before notes gained `questions:`
# fields), without running the search command, so it can be used to compare
# embedding models / search changes honestly. Do not tune search on these
# questions one by one; report aggregate hit rates. Complements
# evals/retrieval_holdout.yaml: it mostly targets notes that file does not use
# as expected answers, and covers $100M Leads at least as heavily as the
# other two books.
#
# Same keys as evals/retrieval_holdout.yaml:
#   style: plain  -> everyday business-owner wording, no Hormozi framework names
#          jargon -> uses the framework's own vocabulary (easy control group)
# expect_notes: the 1-3 notes that most directly answer the question (two are
# listed only when sibling notes answer it equally well).

